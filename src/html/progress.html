<section class="pdl-progress-group">
  <div class="pdl-progress-head">
    <span class="pdl-progress-label">Progreso del proyecto</span>
    <span class="pdl-progress-value">64%</span>
  </div>
  <div class="pdl-progress" role="progressbar" aria-label="Progreso del proyecto" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64">
    <div class="pdl-progress__bar" style="--pdl-progress: 64%"></div>
  </div>
</section>

<!-- progress-linear -->
<div class="pdl-progress-steps" style="--pdl-step-count:4"><span class="pdl-progress-step is-complete"></span><span class="pdl-progress-step is-complete"></span><span class="pdl-progress-step" aria-current="step"></span><span class="pdl-progress-step"></span></div>

<!-- progress-circular -->
<div class="pdl-progress-ring" style="--pdl-progress:68%" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68"><span class="pdl-progress-ring__value">68%</span></div>
