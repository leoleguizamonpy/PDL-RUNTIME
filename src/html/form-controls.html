<!-- text-input -->
<label class="pdl-field"><span class="pdl-label">Nombre</span><input class="pdl-input" autocomplete="name"></label>
<label class="pdl-field"><span class="pdl-label">Descripción</span><textarea class="pdl-textarea" rows="3"></textarea></label>
<label class="pdl-field"><span class="pdl-label">Categoría</span><select class="pdl-select"><option>Branding</option><option>Web</option></select></label>
<div class="pdl-date-group">
  <label class="pdl-field"><span class="pdl-label">Fecha</span><input class="pdl-input" type="date"></label>
  <label class="pdl-field"><span class="pdl-label">Hora</span><input class="pdl-input" type="time"></label>
</div>
<label class="pdl-field">
  <span class="pdl-label">Contraseña</span>
  <span class="pdl-input-control">
    <input class="pdl-input" type="password" autocomplete="current-password">
    <button class="pdl-icon-button pdl-icon-button--ghost pdl-icon-button--sm pdl-input-control__action" type="button" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </span>
</label>

<!-- choice-controls -->
<label class="pdl-check"><input type="checkbox" checked> Checkbox</label>
<label class="pdl-radio"><input type="radio" name="radio-demo" checked> Opción A</label>
<div class="pdl-radio-group">
  <label class="pdl-radio"><input type="radio" name="radio-demo" checked> Opción A</label>
  <label class="pdl-radio"><input type="radio" name="radio-demo"> Opción B</label>
</div>

<!-- switch -->
<label class="pdl-theme-switch">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <span class="pdl-switch"><input type="checkbox" role="switch" aria-label="Tema oscuro" checked><span class="pdl-switch__track" aria-hidden="true"></span></span>
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
</label>

<!-- tag-input -->
<div class="pdl-tag-input" data-pdl-tags>
  <div class="pdl-tag-list" data-pdl-tag-list>
    <span class="pdl-tag" data-pdl-tag="Branding"><span>Branding</span><button class="pdl-tag__remove" type="button" aria-label="Eliminar Branding">×</button></span>
  </div>
  <input class="pdl-tag-input__control" data-pdl-tag-control placeholder="Escribí y Enter">
</div>
