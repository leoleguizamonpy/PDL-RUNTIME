<section class="pdl-calendar" aria-label="Calendario">
  <header class="pdl-calendar__toolbar">
    <strong>Septiembre 2026</strong>
    <div class="pdl-cluster">
      <button class="pdl-button pdl-button--ghost" type="button">Anterior</button>
      <button class="pdl-button pdl-button--ghost" type="button">Siguiente</button>
    </div>
  </header>
  <div class="pdl-calendar__grid">
    <div class="pdl-calendar__weekday">Lun</div><div class="pdl-calendar__weekday">Mar</div><div class="pdl-calendar__weekday">Mié</div><div class="pdl-calendar__weekday">Jue</div><div class="pdl-calendar__weekday">Vie</div><div class="pdl-calendar__weekday">Sáb</div><div class="pdl-calendar__weekday">Dom</div>
  </div>
</section>

<section class="pdl-kanban" data-pdl-kanban>
  <div class="pdl-kanban__column" data-pdl-kanban-column data-column-id="todo">
    <header class="pdl-kanban__head"><span>Pendiente</span><span>1</span></header>
    <article class="pdl-kanban__card" data-pdl-kanban-card data-card-id="task-1">Tarea</article>
  </div>
  <div class="pdl-kanban__column" data-pdl-kanban-column data-column-id="done">
    <header class="pdl-kanban__head"><span>Hecho</span><span>0</span></header>
  </div>
</section>
