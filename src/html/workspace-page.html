<main class="pdl-container pdl-container--fluid pdl-workspace-page" data-pdl-page-profile="workspace">

      <div class="pdl-workspace__resizer" data-pdl-resizer="right" role="separator" aria-orientation="vertical" tabindex="0"></div>
