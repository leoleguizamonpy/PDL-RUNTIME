<section class="pdl-upload">
  <label class="pdl-dropzone" data-pdl-dropzone tabindex="0">
    <input type="file" multiple>
    <span class="pdl-dropzone__title">Seleccionar o arrastrar archivos</span>
    <span class="pdl-dropzone__meta">La validación final depende del producto.</span>
  </label>

  <div class="pdl-file-list">
    <article class="pdl-file-item">
      <span class="pdl-file-item__icon" aria-hidden="true">PDF</span>
      <div class="pdl-file-item__copy">
        <div class="pdl-file-item__name">archivo.pdf</div>
        <div class="pdl-file-item__meta">2,4 MB · 60%</div>
        <div class="pdl-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
          <div class="pdl-progress__bar" style="--pdl-progress: 60%"></div>
        </div>
      </div>
      <div class="pdl-file-item__actions">
        <button class="pdl-button pdl-button--ghost" type="button">Cancelar</button>
      </div>
    </article>
  </div>
</section>
