<form class="pdl-stack" aria-label="Formulario avanzado">
  <fieldset class="pdl-field">
    <legend class="pdl-label">Modalidad</legend>
    <div class="pdl-segmented" data-pdl-segmented>
      <button class="pdl-segmented__item" type="button" aria-pressed="true" data-pdl-segment="standard">Standard</button>
      <button class="pdl-segmented__item" type="button" aria-pressed="false" data-pdl-segment="premium">Premium</button>
    </div>
  </fieldset>

  <!-- Tab bar: equal segments across the container. -->
  <div class="pdl-segmented pdl-segmented--fill" role="tablist" aria-label="Secciones">
    <button class="pdl-segmented__item" type="button" role="tab" aria-selected="true" aria-pressed="true">Contenido</button>
    <button class="pdl-segmented__item" type="button" role="tab" aria-selected="false" aria-pressed="false">Diseño</button>
    <button class="pdl-segmented__item" type="button" role="tab" aria-selected="false" aria-pressed="false">Publicar</button>
  </div>

  <!-- Choice grid: 4 columns, 2 below 22rem; sample over label. -->
  <div class="pdl-field">
    <span class="pdl-label" id="palette-choice">Paleta</span>
    <div class="pdl-segmented pdl-segmented--grid" role="group" aria-labelledby="palette-choice" style="--pdl-segmented-columns: 4; --pdl-segmented-columns-narrow: 2">
      <button class="pdl-segmented__item" type="button" aria-pressed="true"><span class="pdl-button pdl-button--primary pdl-button--sm" aria-hidden="true">Aa</span><span>Claro</span></button>
      <button class="pdl-segmented__item" type="button" aria-pressed="false"><span class="pdl-button pdl-button--primary pdl-button--sm" data-pdl-palette="ocean" aria-hidden="true">Aa</span><span>Océano</span></button>
      <button class="pdl-segmented__item" type="button" aria-pressed="false"><span class="pdl-button pdl-button--primary pdl-button--sm" data-pdl-palette="sage" aria-hidden="true">Aa</span><span>Salvia</span></button>
      <button class="pdl-segmented__item" type="button" aria-pressed="false"><span class="pdl-button pdl-button--primary pdl-button--sm" data-pdl-palette="midnight" aria-hidden="true">Aa</span><span>Medianoche</span></button>
    </div>
  </div>

  <label class="pdl-field">
    <span class="pdl-label">Servicio</span>
    <span class="pdl-combobox" data-pdl-combobox>
      <input class="pdl-input" role="combobox" aria-expanded="false" aria-controls="service-options" autocomplete="off">
      <span class="pdl-combobox__list" id="service-options" role="listbox" hidden>
        <span class="pdl-combobox__option" role="option" data-value="Branding">Branding</span>
        <span class="pdl-combobox__option" role="option" data-value="Web">Diseño web</span>
        <span class="pdl-combobox__option" role="option" data-value="UI/UX">UI/UX</span>
      </span>
    </span>
  </label>

  <label class="pdl-field">
    <span class="pdl-label">Color de acento</span>
    <input class="pdl-color-input" type="color" value="#0b3c48">
  </label>

  <label class="pdl-field">
    <span class="pdl-label">Prioridad</span>
    <span class="pdl-range-row">
      <input class="pdl-range" type="range" min="1" max="10" value="6" data-pdl-range="priority-value">
      <output class="pdl-range-value" id="priority-value">6</output>
    </span>
  </label>

  <div class="pdl-date-group">
    <label class="pdl-field"><span class="pdl-label">Fecha</span><input class="pdl-input" type="date"></label>
    <label class="pdl-field"><span class="pdl-label">Hora</span><input class="pdl-input" type="time"></label>
  </div>
</form>
