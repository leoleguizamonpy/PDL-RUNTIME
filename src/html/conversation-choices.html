<div class="pdl-chat-choices" aria-label="Opciones de respuesta">
  <div class="pdl-chat-choices__list" role="group" aria-label="Seleccioná una opción">
    <button class="pdl-chat-choice" type="button" aria-pressed="false">
      <span class="pdl-chat-choice__index">1</span>
      <span class="pdl-chat-choice__copy">
        <span class="pdl-chat-choice__label">Reconocimiento y coherencia</span>
        <span class="pdl-chat-choice__description">Prioriza consistencia visual y claridad de marca.</span>
      </span>
      <span class="pdl-chat-choice__indicator" aria-hidden="true">→</span>
    </button>

    <button class="pdl-chat-choice" type="button" aria-pressed="true">
      <span class="pdl-chat-choice__index">2</span>
      <span class="pdl-chat-choice__copy">
        <span class="pdl-chat-choice__label">Legitimidad y diferenciación</span>
        <span class="pdl-chat-choice__description">Refuerza percepción profesional y distancia competitiva.</span>
      </span>
      <span class="pdl-chat-choice__indicator" aria-hidden="true">→</span>
    </button>

    <button class="pdl-chat-choice" type="button" aria-pressed="false">
      <span class="pdl-chat-choice__index">3</span>
      <span class="pdl-chat-choice__copy">
        <span class="pdl-chat-choice__label">Equilibrio entre ambos</span>
        <span class="pdl-chat-choice__description">Combina consistencia, legitimidad y diferenciación.</span>
      </span>
      <span class="pdl-chat-choice__indicator" aria-hidden="true">→</span>
    </button>
  </div>

  <button class="pdl-chat-choice__alternate" type="button">Otra respuesta</button>
</div>
