<section class="pdl-stack" aria-label="Estados de carga">

    <span class="pdl-loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
    <span>Procesando</span>
  </div>

  <button class="pdl-button pdl-button--primary" type="button" aria-busy="true">
    <span class="pdl-spinner" aria-hidden="true"></span>

  </button>

  <div class="pdl-stack" aria-busy="true" aria-label="Cargando contenido">
    <span class="pdl-skeleton pdl-skeleton--title"></span>
    <span class="pdl-skeleton pdl-skeleton--line"></span>
    <span class="pdl-skeleton pdl-skeleton--line"></span>
  </div>
</section>
