<!-- topbar -->
<div class="pdl-topbar">
  <div class="pdl-topbar__inner">
    <strong>Proyecto Demo</strong>
    <div class="pdl-menu-anchor">
      <button class="pdl-user-state" type="button" data-pdl-menu-trigger aria-expanded="false" aria-controls="account-menu" data-state="authenticated">
        <span class="pdl-avatar">LL</span>
        <span class="pdl-user-state__copy"><span class="pdl-user-state__name">Leo</span><span class="pdl-user-state__meta">Cuenta activa</span></span>
        <span class="pdl-user-state__status" aria-hidden="true"></span>
      </button>
      <div class="pdl-menu" id="account-menu" role="menu" hidden>
        <div class="pdl-menu__group"><span class="pdl-menu__label">Cuenta</span><button class="pdl-menu__item" role="menuitem" type="button">Perfil</button><button class="pdl-menu__item" role="menuitem" type="button">Configuración</button></div>
        <div class="pdl-menu__group"><button class="pdl-menu__item pdl-menu__item--danger" role="menuitem" type="button">Cerrar sesión</button></div>

    </div>

</div>

<!-- tabs -->
<div class="pdl-tabs" role="tablist" aria-label="Vistas del proyecto" data-pdl-tabs>
  <button class="pdl-tabs__tab" type="button" role="tab" id="tab-summary" aria-selected="true" aria-controls="panel-summary">Resumen</button>
  <button class="pdl-tabs__tab" type="button" role="tab" id="tab-activity" aria-selected="false" aria-controls="panel-activity">Actividad</button>
  <button class="pdl-tabs__tab" type="button" role="tab" id="tab-files" aria-selected="false" aria-controls="panel-files">Archivos</button>
  <button class="pdl-tabs__tab" type="button" role="tab" aria-selected="false" aria-disabled="true">Facturación</button>
</div>
<div class="pdl-panel" role="tabpanel" id="panel-summary" aria-labelledby="tab-summary">Resumen del proyecto.</div>
<div class="pdl-panel" role="tabpanel" id="panel-activity" aria-labelledby="tab-activity" hidden>Actividad reciente.</div>
<div class="pdl-panel" role="tabpanel" id="panel-files" aria-labelledby="tab-files" hidden>Archivos del proyecto.</div>
