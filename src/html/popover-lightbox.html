<button class="pdl-button pdl-button--outline" type="button" aria-expanded="false" data-pdl-popover-open="example-popover">Más acciones</button>
<div class="pdl-popover" id="example-popover" hidden>
  <button class="pdl-menu-item" type="button">Renombrar</button>

</div>
