<figure class="pdl-chart" aria-labelledby="revenue-chart-title">
  <figcaption class="pdl-chart__head">
    <div>
      <h3 class="pdl-chart__title" id="revenue-chart-title">Ingresos por mes</h3>
      <span class="pdl-chart__meta">Últimos 6 meses</span>
    </div>
  </figcaption>

  <div class="pdl-chart__plot" aria-hidden="true">
    <div class="pdl-chart__grid"></div>
    <div class="pdl-bar-chart" style="--pdl-bars:6">
      <span class="pdl-bar" style="--pdl-value:42%"></span>
      <span class="pdl-bar" style="--pdl-value:57%"></span>
      <span class="pdl-bar" style="--pdl-value:51%"></span>
      <span class="pdl-bar" style="--pdl-value:68%"></span>
      <span class="pdl-bar" style="--pdl-value:76%"></span>
      <span class="pdl-bar" style="--pdl-value:88%"></span>
    </div>
  </div>

  <table class="pdl-chart__table">
    <thead><tr><th>Mes</th><th>Ingresos</th></tr></thead>
    <tbody>
      <tr><td>Abril</td><td>42</td></tr>
      <tr><td>Mayo</td><td>57</td></tr>
      <tr><td>Junio</td><td>51</td></tr>
      <tr><td>Julio</td><td>68</td></tr>
      <tr><td>Agosto</td><td>76</td></tr>
      <tr><td>Septiembre</td><td>88</td></tr>
    </tbody>
  </table>
</figure>
