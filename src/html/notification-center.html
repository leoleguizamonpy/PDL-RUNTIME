<section class="pdl-notification-center" data-pdl-notification-center aria-label="Notificaciones">
  <header class="pdl-notification-center__head">
    <strong class="pdl-notification__title">Notificaciones</strong>
    <button class="pdl-button pdl-button--ghost" type="button" data-pdl-mark-all-read>Marcar leídas</button>
  </header>
  <div class="pdl-notification-center__list">
    <article class="pdl-notification" data-read="false">
      <div>
        <strong class="pdl-notification__title">Decisión pendiente</strong>
        <p class="pdl-notification__copy">Se requiere una validación antes de continuar.</p>
        <span class="pdl-notification__meta">Ahora</span>
      </div>
    </article>
  </div>
</section>
