<!-- Curated palette and type pairing on any element; centered composition. -->
<section class="pdl-panel pdl-stack pdl-stack--center pdl-sticker-area" data-pdl-palette="ocean" data-pdl-type="editorial">
  <!-- Cover image: a 3:1 banner the image fills. With --overlap the next
       item (a photo up to 6rem) rises across its lower edge. -->
  <div class="pdl-cover"><img src="cover.webp" alt=""></div>
  <div class="pdl-cover pdl-cover--overlap"><img src="cover.webp" alt=""></div>
  <img class="pdl-avatar" src="portrait.webp" alt="">
  <h2 class="pdl-card__title">Título de sección</h2>
  <!-- Embedded player in a 16:9 frame. -->
  <div class="pdl-embed">
    <iframe src="https://www.youtube-nocookie.com/embed/VIDEO_ID" title="Video" loading="lazy" allowfullscreen></iframe>
  </div>
  <a class="pdl-button pdl-button--primary pdl-button--wrap" href="#">Botón con la paleta</a>
  <!-- A still frame instead of a player (for example, when it cannot play here). -->
  <div class="pdl-embed"><img src="https://i.ytimg.com/vi/M7lc1UVf-VE/hqdefault.jpg" alt=""></div>
  <!-- Vertical video and audio players. -->
  <div class="pdl-embed pdl-embed--vertical"><img src="https://i.ytimg.com/vi/M7lc1UVf-VE/hqdefault.jpg" alt=""></div>
  <div class="pdl-embed pdl-embed--audio"></div>
  <!-- The action the page leads with. -->
  <a class="pdl-button pdl-button--primary pdl-button--lg pdl-button--wrap pdl-button--featured" href="#">Botón destacado</a>
  <!-- An image-led link card, a button with a thumbnail, and a motion. -->
  <a class="pdl-link-card" href="#"><span class="pdl-link-card__media"><img src="cover.webp" alt=""></span><span class="pdl-link-card__label">Mirá el último video</span></a>
  <a class="pdl-button pdl-button--outline pdl-button--wrap" href="#"><img class="pdl-button__thumb" src="thumb.webp" alt=""><span>Con miniatura</span></a>
  <a class="pdl-button pdl-button--primary pdl-button--wrap pdl-motion--wiggle" href="#">Con movimiento</a>
  <!-- Card variants, square cards in pairs, and a still with a play mark. -->
  <a class="pdl-link-card pdl-link-card--banner" href="#"><span class="pdl-link-card__media"><img src="cover.webp" alt=""></span><span class="pdl-link-card__label">Banner</span></a>
  <div class="pdl-link-grid">
    <a class="pdl-link-card pdl-link-card--square" href="#"><span class="pdl-link-card__media"><img src="a.webp" alt=""></span><span class="pdl-link-card__label">Uno</span></a>
    <a class="pdl-link-card pdl-link-card--square" href="#"><span class="pdl-link-card__media"><img src="b.webp" alt=""></span><span class="pdl-link-card__label">Dos</span></a>
  </div>
  <a class="pdl-link-card pdl-link-card--row" href="#"><span class="pdl-link-card__media"><img src="a.webp" alt=""></span><span class="pdl-link-card__text"><span class="pdl-link-card__label">Fila</span><span class="pdl-link-card__meta">ejemplo.com</span></span></a>
  <div class="pdl-embed"><img src="https://i.ytimg.com/vi/M7lc1UVf-VE/hqdefault.jpg" alt=""><span class="pdl-embed__play" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#000" opacity=".6"/><path d="M19 15l15 9-15 9Z" fill="#fff"/></svg></span></div>
  <!-- Frosted glass over a backdrop. -->
  <a class="pdl-button pdl-button--glass pdl-button--wrap" href="#">Botón de vidrio</a>
  <!-- A large leading photo that fades into the page, and a logo as the title. -->
  <div class="pdl-hero-photo"><img src="portrait.webp" alt=""></div>
  <h1 class="pdl-page-title"><img class="pdl-page-logo" src="logo.webp" alt="Nombre de la marca"></h1>
  <!-- A sticker, placed with custom properties (set them from a stylesheet where inline styles are blocked). -->
  <span class="pdl-sticker" style="--pdl-sticker-x: 88%; --pdl-sticker-y: 2rem; --pdl-sticker-rotate: 12deg" aria-hidden="true"><img src="sticker.svg" alt=""></span>
</section>
